[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dsh-vane-runtime"
version = "0.1.0"
description = "Persistent Vane runtime and portable analysis package/artifact contracts"
requires-python = ">=3.11,<3.13"
dependencies = [
  "vane-ai==0.1.0", "pytz>=2025.2", "pyarrow>=19,<24", "PyYAML>=6,<7",
  "jsonschema>=4.23,<5", "psycopg[binary]>=3.2,<4", "PyMuPDF>=1.25,<2",
  "Pillow>=11,<13", "httpx[socks]>=0.28,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["python/dsh_vane_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "dsh_vane_runtime/contracts"
"uv.lock" = "dsh_vane_runtime/uv.lock"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = ["integration: real Vane execution", "external: requires explicitly configured external services"]
